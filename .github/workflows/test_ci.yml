name: SortWise CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v3

    # Set up the target Python environment for runtime execution
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    # Install necessary project library dependencies and verify environment integrity
    - name: Install System Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # Automatically test the source framework against critical python syntax errors (Linting)
    - name: Lint Code with flake8
      run: |
        # The runtime build pipeline will automatically stop if syntax errors or undefined names are triggered
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
